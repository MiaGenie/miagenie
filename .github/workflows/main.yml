name: Build and Publish

on:
  pull_request:
    branches:
      - dev
  release:
    types: [published]
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Extract branch name
        shell: bash
        run: echo "branch=${GITHUB_BASE_REF:-main}-" >> $GITHUB_OUTPUT
        id: extract_branch
    
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: miagenie/miagenie
          labels: |
            org.opencontainers.image.authors=miagenie
          tags: |
            type=schedule
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=ref,event=pr,prefix=${{ steps.extract_branch.outputs.branch }}pr-
            type=sha,format=short,prefix=${{ steps.extract_branch.outputs.branch }}sha-
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          secrets: |
            "composer-auth=${{ secrets.COMPOSER_AUTH }}"
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
